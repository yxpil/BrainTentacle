name: mirror-pages

# 将 Release 资产镜像到 GitHub Pages（https://yxpil.github.io/bit/）。
# osbt.space 等下载入口直链该地址：直连 200 不重定向，文件托管在 GitHub，无需自有服务器。
# 每次部署为全量站点（仅含最新 tag 的资产），旧版本资产由 GitHub Releases 本身承担。
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "要镜像的 tag（留空自动取最新 Release）"
        required: false
        default: ""
  # 兜底：release 整体结束（exotic 慢任务传完）后再镜像一次，把后上传的
  # loongarch64/riscv64/ppc64le 等资产补进版本页；finalize 的主动 dispatch 负责快速路径
  workflow_run:
    workflows: [release]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

# Pages 部署互斥，新部署覆盖旧的
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  mirror:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v4
      - uses: actions/checkout@v4
      - name: 下载 Release 资产并组装站点
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          # 未显式指定 tag 时自动取最新 Release（避免默认旧 tag 把站点覆盖回旧版本）
          if [ -z "$TAG" ]; then TAG=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name); fi
          echo "镜像 $TAG"
          VERSION="${TAG#v}"
          # 最新 Release tag：并发发布时（如 v0.5.14 修复版与 v0.5.15 同时在跑）两条流水线的
          # finalize 都会 dispatch 本 workflow，谁后部署谁覆盖站点根——根清单必须钉在最新版，
          # 否则已装旧版的用户拿到的 latest.json 版本不增长，自动更新永远不触发
          LATEST_TAG=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
          LATEST_VERSION="${LATEST_TAG#v}"
          mkdir -p "site/$VERSION"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir "site/$VERSION"
          # latest.json 提到站点根：客户端自动更新检测优先请求 /bit/latest.json。
          # 镜像的就是最新版 → 直接用本 tag 的；镜像的是旧版 → 根清单取最新 Release 的，
          # 旧版目录照常镜像（版本历史入口），但根清单绝不随旧版本回退
          if [ "$VERSION" = "$LATEST_VERSION" ]; then
            [ -f "site/$VERSION/latest.json" ] && cp "site/$VERSION/latest.json" site/latest.json
          else
            gh release download "$LATEST_TAG" --repo "$GITHUB_REPOSITORY" --dir site --pattern "latest.json" --clobber \
              || echo "最新版 latest.json 下载失败，本次部署不含根清单（客户端回退 GitHub API 源）"
          fi

          # 页面交给 packaging/pages/gen_pages.py：按「系统 + 架构 + 包类型」分组标注每个
          # 资产，并用 Client Hints 识别访问者设备、把对应包高亮、对下错的组合加确认。
          # 原来是把 release 目录整个 ls 成一条无标注的直链列表，20 多个同版本不同架构的
          # 文件排在一起，x64 电脑很容易点到 _aarch64-setup.exe。
          python3 packaging/pages/gen_pages.py --assets-dir "site/$VERSION" --version "$VERSION" --latest-tag "$LATEST_TAG" --site-root site
          ls -la "site/$VERSION"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
