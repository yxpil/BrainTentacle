name: release

# Electron 发布链（M4 全平台）：
#   compile-check（闸门）→ napi 矩阵（六目标 bit.node + bit-cli）→ gui 矩阵（Windows + Linux + macOS）
#   → musl/exotic（只编 bit-cli，无 GUI）→ finalize（latest.json 全平台键位）
# 手动触发（可指定已有 tag 补发资产，可勾选跳过慢平台）或推送 v* tag 自动触发
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "要构建并上传资产的 tag（如 v0.7.2）"
        required: true
        default: "v0.7.2"
      include_macos:
        description: "是否同时构建 macOS 包"
        type: boolean
        required: false
        default: true
      include_windows:
        description: "是否构建 Windows 包（未签名 exe 会被杀毒误报，可关闭）"
        type: boolean
        required: false
        default: true
      include_exotic:
        description: "是否构建国产/新兴架构与 musl（riscv64 / loongarch64 / ppc64le / alpine，QEMU 模拟编译较慢）"
        type: boolean
        required: false
        default: true
  push:
    tags:
      - "v*"

permissions:
  contents: write
  actions: write

jobs:
  # 确保目标 tag 的 Release 已存在（gh release upload 不支持自动创建）
  ensure-release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - id: tag
        run: echo "tag=${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"
      - run: gh api repos/$GITHUB_REPOSITORY/releases/tags/$TAG >/dev/null 2>&1 || gh release create "$TAG" --title "触手怪 $TAG（Electron · 全平台）" --generate-notes --repo "$GITHUB_REPOSITORY"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}

  # 廉价编译闸门：只做前端构建 + workspace cargo check（不链接/不打包），
  # 专门拦截类型错误。所有平台 job 依赖它——代码有错只烧这一个 job。
  compile-check:
    needs: ensure-release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: 版本一致性闸门（tag = package.json = Cargo.toml = Cargo.lock = tauri.conf.json）
        run: |
          TAG="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          EXPECT="${TAG#v}"
          PKG=$(node -p "require('./package.json').version")
          CARGO=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          TAURI=$(node -p "require('./src-tauri/tauri.conf.json').version")
          LOCK=$(grep -A1 '^name = "bit-core"$' Cargo.lock | sed -n 's/^version = "\(.*\)"/\1/p')
          echo "tag=$TAG package.json=$PKG Cargo.toml=$CARGO tauri.conf.json=$TAURI Cargo.lock=$LOCK"
          for v in "$PKG" "$CARGO" "$TAURI" "$LOCK"; do
            [ "$v" = "$EXPECT" ] || { echo "::error::版本标识不一致：$v != $EXPECT（tag $TAG）"; exit 1; }
          done
      - name: 安装 Linux 系统依赖（src-tauri 过渡期壳仍在 workspace，需要 webkit 头）
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - name: 前端构建 + 静态检查
        run: |
          npm ci
          npm run lint
          npm run build
      - name: Rust 类型检查（workspace 闸门，遇错即停）
        run: cargo check --locked

  # napi 矩阵：六目标原生构建（bit.node 进 Electron 主进程 + bit-cli sidecar）
  napi:
    needs: [ensure-release, compile-check]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-x64,   os: windows-latest,   triple: x86_64-pc-windows-msvc,    lib: bit_napi.dll }
          - { name: windows-arm64, os: windows-11-arm,   triple: aarch64-pc-windows-msvc,   lib: bit_napi.dll }
          - { name: linux-x64,     os: ubuntu-24.04,     triple: x86_64-unknown-linux-gnu,  lib: libbit_napi.so }
          - { name: linux-arm64,   os: ubuntu-24.04-arm, triple: aarch64-unknown-linux-gnu, lib: libbit_napi.so }
          - { name: macos-arm64,   os: macos-15,         triple: aarch64-apple-darwin,      lib: libbit_napi.dylib }
          - { name: macos-x64,     os: macos-15,         triple: x86_64-apple-darwin,       lib: libbit_napi.dylib }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - name: 安装交叉编译目标（mac x64 在 arm runner 上交叉构建）
        if: matrix.name == 'macos-x64'
        run: rustup target add x86_64-apple-darwin
      - name: 安装 Linux 系统依赖（enigo/libxdo + openssl）
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev build-essential file libxdo-dev
      - name: 构建（${{ matrix.triple }}）
        run: cargo build --release --locked --target ${{ matrix.triple }} -p bit-napi -p bit-core
      - name: 归一物料名（bit.node + bit-cli + 托盘图标 → packaging/native）
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force packaging/native | Out-Null
          Copy-Item "target/${{ matrix.triple }}/release/${{ matrix.lib }}" packaging/native/bit.node
          $cli = "target/${{ matrix.triple }}/release/bit-cli"
          if (Test-Path "$cli.exe") { Copy-Item "$cli.exe" packaging/native/bit-cli.exe } else { Copy-Item $cli packaging/native/bit-cli }
          # 托盘/通知图标随物料走（packaging/native 不入库，CI checkout 里无此文件；
          # 缺了它 extraResources 不注入 → 打包产物 resources/ 无图标 → 托盘空图标）。
          # main.cjs 按平台取图：win32 用 icon.ico，其余用 icon.png（nativeImage 不吃 ico）
          if ($env:RUNNER_OS -eq 'Windows') { Copy-Item "src-tauri/icons/icon.ico" packaging/native/icon.ico } else { Copy-Item "src-tauri/icons/icon.png" packaging/native/icon.png }
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.name }}
          path: packaging/native/*
          if-no-files-found: error

  # GUI：electron-builder Windows 双架构出包
  gui-windows:
    needs: [ensure-release, napi]
    if: github.event_name == 'push' || inputs.include_windows
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-x64,   os: windows-latest, napi: windows-x64,   arch: x64,     eb_arch: x64 }
          - { name: windows-arm64, os: windows-11-arm, napi: windows-arm64, arch: aarch64, eb_arch: arm64 }
    env:
      TAG: ${{ needs.ensure-release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: 前端构建
        run: |
          npm ci
          npm run build
      - uses: actions/download-artifact@v4
        with:
          name: native-${{ matrix.napi }}
          path: packaging/native
      - name: electron-builder（NSIS ${{ matrix.eb_arch }}）
        shell: bash
        run: |
          VERSION="${TAG#v}"
          # pwsh 会吞 ${ext} 宏；win 的 artifactName 全字面量，不经宏
          npx electron-builder --win nsis --${{ matrix.eb_arch }} \
            "-c.artifactName=BIT_${VERSION}_${{ matrix.arch }}-setup.exe" --publish never
      - name: 便携版 zip
        shell: pwsh
        run: |
          $VERSION = "$env:TAG".TrimStart('v')
          $dir = (Get-ChildItem "release/win*-unpacked" -Directory | Select-Object -First 1).FullName
          Compress-Archive -Path "$dir/*" -DestinationPath "release/BIT_${VERSION}_$env:ARCH-portable.zip" -Force
          if (-not (Test-Path "release/BIT_${VERSION}_$env:ARCH-portable.zip")) { exit 1 }
        env:
          ARCH: ${{ matrix.arch }}
      - name: 上传到 Release
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $repo = "$env:GITHUB_REPOSITORY"
          gh release upload "$env:TAG" "release/BIT_*-setup.exe" "release/BIT_*-portable.zip" --clobber --repo "$repo"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  # GUI：electron-builder Linux 双架构出包
  gui-linux:
    needs: [ensure-release, napi]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64,   os: ubuntu-24.04,     napi: linux-x64,   arch: amd64 }
          - { name: linux-arm64, os: ubuntu-24.04-arm, napi: linux-arm64, arch: aarch64 }
    env:
      TAG: ${{ needs.ensure-release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: 前端构建
        run: |
          npm ci
          npm run build
      - uses: actions/download-artifact@v4
        with:
          name: native-${{ matrix.napi }}
          path: packaging/native
      - name: 恢复 sidecar 执行位（artifact 下载不保留权限）
        run: chmod +x packaging/native/bit-cli
      - name: electron-builder（AppImage + deb + rpm）
        run: |
          VERSION="${TAG#v}"
          # bash 双引号里 \${ext} 转义为字面量，交 electron-builder 展开
          npx electron-builder --linux AppImage deb rpm \
            "-c.artifactName=BIT_${VERSION}_${{ matrix.arch }}.\${ext}" --publish never
      - name: 上传到 Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$TAG" release/*.AppImage release/*.deb release/*.rpm --clobber --repo "$GITHUB_REPOSITORY"

  # GUI：electron-builder macOS 双架构出包（ad-hoc 深签名防 Gatekeeper「已损坏」）
  gui-macos:
    needs: [ensure-release, napi]
    if: github.event_name == 'push' || inputs.include_macos
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macos-arm64, napi: macos-arm64, arch: aarch64 }
          - { name: macos-x64,   napi: macos-x64,   arch: x64 }
    env:
      TAG: ${{ needs.ensure-release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: 前端构建
        run: |
          npm ci
          npm run build
      - uses: actions/download-artifact@v4
        with:
          name: native-${{ matrix.napi }}
          path: packaging/native
      - name: 恢复 sidecar 执行位
        run: chmod +x packaging/native/bit-cli
      - name: electron-builder（.app，x64 交叉构建）
        run: |
          if [ "${{ matrix.arch }}" = "x64" ]; then
            npx electron-builder --mac --dir --x64 --publish never
          else
            npx electron-builder --mac --dir --publish never
          fi
      - name: ad-hoc 深签名 + dmg/zip（防 Gatekeeper"已损坏"）
        run: |
          VERSION="${TAG#v}"
          APP=$(ls -d release/mac*/BIT.app | head -1)
          printf 'APPL????' > "$APP/Contents/PkgInfo"
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict "$APP"
          mkdir -p release/dmg
          STAGE=$(mktemp -d)
          cp -R "$APP" "$STAGE/BIT.app"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname "BIT" -srcfolder "$STAGE" -ov -format UDZO -fs HFS+ "release/dmg/BIT_${VERSION}_${{ matrix.arch }}.dmg"
          rm -rf "$STAGE"
          # 便携版：ditto 保留签名与扩展属性（普通 zip 破坏签名导致"已损坏"）
          ditto -c -k --keepParent --sequesterRsrc "$APP" "release/dmg/BIT_${VERSION}_${{ matrix.arch }}-app.zip"
      - name: 上传到 Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$TAG" release/dmg/*.dmg release/dmg/*-app.zip --clobber --repo "$GITHUB_REPOSITORY"

  # Universal：arm64 + x64 合一的 mac 包（.dmg + -app.zip），给「不确定自己芯片」或
  # 需要 Rosetta 兜底的用户。与上面双架构 job 平行、不进 finalize 的 needs：
  # 它失败只会少这两个包，不会连累已经打好的 23 个资产与 latest.json。
  gui-macos-universal:
    needs: [ensure-release, napi]
    if: github.event_name == 'push' || inputs.include_macos
    continue-on-error: true
    runs-on: macos-15
    env:
      TAG: ${{ needs.ensure-release.outputs.tag }}
      # 让 before-pack 别把「不是本机架构」的 sherpa 原生包当死重量清掉：
      # universal 包里两架构的原生包都得留着，运行期由 process.arch 自己挑
      BIT_UNIVERSAL_BUILD: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: 前端构建
        run: |
          npm ci
          npm run build
      - uses: actions/download-artifact@v4
        with:
          name: native-macos-arm64
          path: packaging/native-arm64
      - uses: actions/download-artifact@v4
        with:
          name: native-macos-x64
          path: packaging/native-x64
      - name: 合 universal 物料（extraResources 走 lipo，必须真是 fat）
        run: |
          set -euo pipefail
          mkdir -p packaging/native
          lipo -create packaging/native-arm64/bit.node packaging/native-x64/bit.node -output packaging/native/bit.node
          lipo -create packaging/native-arm64/bit-cli packaging/native-x64/bit-cli -output packaging/native/bit-cli
          chmod +x packaging/native/bit-cli
          cp packaging/native-arm64/icon.png packaging/native/icon.png
          echo "bit.node 架构: $(lipo -archs packaging/native/bit.node)"
          echo "bit-cli 架构: $(lipo -archs packaging/native/bit-cli)"
          lipo -archs packaging/native/bit.node | grep -q arm64
          lipo -archs packaging/native/bit.node | grep -q x86_64
      - name: 补齐两架构 sherpa 原生包（npm 只会装构建机那一份）
        run: |
          set -euo pipefail
          V=$(node -p "require('./voice-bridge/node_modules/sherpa-onnx-node/package.json').version")
          cd voice-bridge
          for a in arm64 x64; do
            if [ ! -f "node_modules/sherpa-onnx-darwin-$a/sherpa-onnx.node" ]; then
              npm install --no-save --no-package-lock --ignore-scripts --force "sherpa-onnx-darwin-$a@$V"
            fi
            lipo -archs "node_modules/sherpa-onnx-darwin-$a/sherpa-onnx.node"
          done
      - name: electron-builder --universal（.app）
        run: npx electron-builder --mac --dir --universal --publish never
      - name: ad-hoc 深签名 + dmg/zip
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          APP=$(ls -d release/mac*/BIT.app | head -1)
          printf 'APPL????' > "$APP/Contents/PkgInfo"
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict "$APP"
          mkdir -p release/dmg-universal
          STAGE=$(mktemp -d)
          cp -R "$APP" "$STAGE/BIT.app"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname "BIT" -srcfolder "$STAGE" -ov -format UDZO -fs HFS+ "release/dmg-universal/BIT_${VERSION}_universal.dmg"
          rm -rf "$STAGE"
          ditto -c -k --keepParent --sequesterRsrc "$APP" "release/dmg-universal/BIT_${VERSION}_universal-app.zip"
      # 出包后逐件核对架构：主执行体与 bit.node/bit-cli 必须 fat；
      # 目录名不带架构标记的单架构 .node 会让另一种芯片启动即崩，直接判失败。
      - name: 校验产物真是双架构
        run: |
          set -euo pipefail
          APP=$(ls -d release/mac*/BIT.app | head -1)
          echo "BIT: $(lipo -archs "$APP/Contents/MacOS/BIT")"
          lipo -archs "$APP/Contents/MacOS/BIT" | grep -q arm64
          lipo -archs "$APP/Contents/MacOS/BIT" | grep -q x86_64
          lipo -archs "$APP/Contents/Resources/bit.node" | grep -q x86_64
          lipo -archs "$APP/Contents/Resources/bit-cli" | grep -q x86_64
          UNP="$APP/Contents/Resources/app.asar.unpacked"
          if [ -d "$UNP" ]; then
            for f in $(find "$UNP" -name '*.node'); do
              ARCHS=$(lipo -archs "$f" || echo "?")
              case "$f" in
                *darwin-arm64*|*darwin-x64*|*arm64*|*x64*) echo "按架构选包 $f: $ARCHS" ;;
                *) echo "单架构原生包 $f: $ARCHS"
                   echo "$ARCHS" | grep -q arm64 && echo "$ARCHS" | grep -q x86_64 || { echo "::error::$f 只有 $ARCHS，universal 包另一种芯片会加载失败"; exit 1; } ;;
              esac
            done
          fi
          # dmg 自检：挂上、看到 BIT.app、再弹出
          MNT=$(hdiutil attach -nobrowse -readonly "release/dmg-universal/BIT_*.dmg" | tail -1 | awk '{print $NF}')
          ls "$MNT/BIT.app/Contents/MacOS/BIT" && hdiutil detach "$MNT" -quiet
      - name: 上传到 Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$TAG" release/dmg-universal/*.dmg release/dmg-universal/*-app.zip --clobber --repo "$GITHUB_REPOSITORY"

  # Alpine (musl)：只编 bit-cli（无 GUI——Electron 无 musl 二进制，已拍板）
  linux-musl:
    needs: [ensure-release, compile-check]
    if: github.event_name == 'push' || inputs.include_exotic != false
    continue-on-error: true
    # aarch64 用 ARM 原生 runner：QEMU 模拟下 Alpine edge 的 rustc 会 SIGBUS
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            platform: linux/amd64
          - arch: aarch64
            platform: linux/arm64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - name: 容器内构建 bit-cli（alpine ${{ matrix.arch }}）
        run: |
          VERSION="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          PLATFORM="${{ matrix.platform }}"
          # alpine:edge 基础镜像已不再预装 bash（2026-09 起），先 apk 装 bash 再跑构建脚本
          docker run --rm --platform "$PLATFORM" \
            -v "$PWD":/repo -w /repo \
            alpine:edge \
            sh -c "apk add --no-cache bash && bash packaging/musl/build.sh ${{ matrix.arch }} \"${VERSION#v}\""
      - name: 上传到 Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.ensure-release.outputs.tag }}"
          gh release upload "$TAG" packaging/musl/out/bit-cli_*-musl.tar.gz --clobber --repo "$GITHUB_REPOSITORY"

  # 国产/新兴架构（riscv64 / loongarch64 / ppc64le）：只编 bit-cli + deb（无 GUI，QEMU 模拟编译较慢）
  # 钉在 24.04：ubuntu-latest 切到 26.04 后 qemu-user-static 无安装候选（0.7.3 首跑踩到）
  linux-exotic:
    needs: [ensure-release, compile-check]
    if: github.event_name == 'push' || inputs.include_exotic != false
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: riscv64
            image: debian:trixie
            platform: linux/riscv64
          # loong64 社区镜像的 manifest 架构名是非标准的 "loong64"，按 digest 固定拉取
          - arch: loongarch64
            image: ghcr.io/loong64/debian@sha256:df06b06128d3b935288d4f601bab42ba68fd61730fd0957b1ef197f1df79346c
            platform: ""
          - arch: ppc64le
            image: debian:trixie
            platform: linux/ppc64le
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - name: 安装 QEMU 模拟器
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-user-static
          ls /proc/sys/fs/binfmt_misc/ | grep -qx "qemu-loongarch64"
          ls /proc/sys/fs/binfmt_misc/ | grep -qx "qemu-riscv64"
          ls /proc/sys/fs/binfmt_misc/ | grep -qx "qemu-ppc64le"
      - name: 容器内构建 bit-cli（${{ matrix.arch }}）
        run: |
          VERSION="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          PLATFORM="${{ matrix.platform }}"
          docker run --rm ${PLATFORM:+--platform $PLATFORM} \
            -v "$PWD":/repo -w /repo \
            ${{ matrix.image }} \
            bash packaging/exotic/build.sh ${{ matrix.arch }} "${VERSION#v}"
      - name: 上传到 Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.ensure-release.outputs.tag }}"
          gh release upload "$TAG" \
            packaging/exotic/out/bit-cli_*.deb \
            packaging/exotic/out/bit-cli_*.tar.gz \
            --clobber --repo "$GITHUB_REPOSITORY"
      - name: 刷新镜像（exotic 晚于 finalize 上传，mirror 需单独同步）
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run mirror-pages.yml -f tag="${{ needs.ensure-release.outputs.tag }}" --repo "$GITHUB_REPOSITORY"

  # 收尾：核心平台构建完成后，自动生成 latest.json 上传到 Release，
  # 并触发 mirror-pages 刷新镜像 + sync-channels 渠道同步。
  # 资产键位与 Tauri 时代完全一致（客户端 pick_asset / sync-channels 零改动）。
  finalize:
    needs: [ensure-release, gui-linux, gui-windows, gui-macos]
    if: >-
      always() && !cancelled() &&
      needs.ensure-release.result == 'success' &&
      needs.gui-linux.result == 'success' &&
      (needs.gui-windows.result == 'success' || needs.gui-windows.result == 'skipped') &&
      (needs.gui-macos.result == 'success' || needs.gui-macos.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: 生成 latest.json + 触发 Pages 镜像
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.ensure-release.outputs.tag }}
        run: |
          VERSION="${TAG#v}"
          # notes 取 Release 说明前 300 字符，与客户端 GitHub API 回退路径的截断一致
          NOTES=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body -q .body | head -c 300)
          # assets 映射：客户端自动更新按平台取直链（BIT 客户端 pick_asset 消费）
          BASE="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG"
          jq -n --arg v "$VERSION" --arg n "$NOTES" --arg u "https://yxpil.github.io/BrainTentacle/$VERSION/" \
            --arg w64 "$BASE/BIT_${VERSION}_x64-setup.exe" \
            --arg war "$BASE/BIT_${VERSION}_aarch64-setup.exe" \
            --arg maa "$BASE/BIT_${VERSION}_aarch64-app.zip" \
            --arg max "$BASE/BIT_${VERSION}_x64-app.zip" \
            --arg lx64 "$BASE/BIT_${VERSION}_amd64.AppImage" \
            --arg larm "$BASE/BIT_${VERSION}_aarch64.AppImage" \
            '{version: $v, notes: $n, url: $u, assets: {
              "windows-x64": $w64, "windows-arm64": $war,
              "macos-arm64": $maa, "macos-x64": $max,
              "linux-x64": $lx64, "linux-arm64": $larm
            }}' > latest.json
          cat latest.json
          gh release upload "$TAG" latest.json --clobber --repo "$GITHUB_REPOSITORY"
          gh workflow run mirror-pages.yml -f tag="$TAG" --repo "$GITHUB_REPOSITORY"
          # 渠道同步不等 exotic 慢任务：核心平台一出包就推 scoop 等；
          # release 整体结束后 sync-channels 的 workflow_run 兜底再补 exotic 资产
          gh workflow run sync-channels.yml -f tag="$TAG" --repo "$GITHUB_REPOSITORY"
          echo "latest.json 已上传，Pages 镜像已触发（tag=$TAG）"
