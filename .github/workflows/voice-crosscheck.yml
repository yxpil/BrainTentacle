name: voice-crosscheck

# 多端联调前置自检：用真机 runner 跑「不需要人坐在屏幕前」的链路——
#   1) 桌面能力探测矩阵（截图后端 / 粘贴工具的选择与缺工具提示）
#   2) 本地合成内核按平台真下载 → 解档 → 选名 → 执行（含 Windows DLL / Linux .so 加载）
#   3) 跨架构识别原生包补装（electron-builder beforePack 的同一段逻辑）
#   4) 识别 worker 起停 + 固定素材 WAV 转写（含 Linux LD_LIBRARY_PATH / Windows PATH）
# 触发：手动 dispatch + 语音相关文件变更时自动跑（见下方 on: 说明）。
# 不打 tag、不出包、不上传任何产物，也不接进发布链。
# 交互部分（真实框选、抢焦点粘贴、辅助功能/UAC 弹窗）在这里验不了，仍需目标机器人工点一遍。
# 触发说明：workflow_dispatch 要求工作流文件存在于**默认分支**才会在 Actions 里注册；
# 本文件只在 windows 分支上，光有 dispatch 是点不起来的。故再加一个按路径收窄的 push 触发——
# 只有语音/桌面能力相关代码变更才会跑这条自检，且它不出包、不上传产物、不参与发布链。
# 等这套逻辑合进默认分支后，可以把 push 去掉只留手动。
on:
  workflow_dispatch:
    inputs:
      with_asr:
        description: "跑识别端到端（各平台下载约 240MB 模型）"
        type: boolean
        default: true
      with_kernel:
        description: "跑合成内核端到端（各平台下载约 20-28MB）"
        type: boolean
        default: true
  push:
    branches:
      - windows
    paths:
      - "crates/bit-core/src/voice.rs"
      - "crates/bit-core/src/tts.rs"
      - "crates/bit-core/src/download.rs"
      - "voice-bridge/**"
      - "electron/desktop-capabilities.cjs"
      - "electron/main.cjs"
      - "scripts/before-pack.cjs"
      - "e2e/**"
      - ".github/workflows/voice-crosscheck.yml"

permissions:
  contents: read

concurrency:
  group: voice-crosscheck-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  crosscheck:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          # xcheck_* = beforePack 要补装的目标，故意选不等于 runner 自身的架构，
          # 才能证明跨架构补装在各 OS 上成立；skip_* 必须是 registry 里不存在的组合
          - name: windows-x64
            os: windows-latest
            xcheck_platform: win32
            xcheck_arch: 0 # Arch.ia32 —— 真实发布，应补装成功
            skip_platform: win32
            skip_arch: 3 # Arch.arm64 —— sherpa 无此包，应明确跳过
          - name: linux-x64
            os: ubuntu-24.04
            xcheck_platform: linux
            xcheck_arch: 3 # Arch.arm64
            skip_platform: linux
            skip_arch: 2 # Arch.armv7l —— 无此包
          - name: macos-arm64
            os: macos-14
            xcheck_platform: darwin
            xcheck_arch: 1 # Arch.x64
            skip_platform: darwin
            skip_arch: 4 # Arch.universal —— 无此包
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: voice-bridge/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      # 只装 voice-bridge：识别原生包（sherpa-onnx-<os>-<arch>）由 npm 按 runner 自身平台落位。
      # 不跑根 npm ci——根 postinstall 会嵌套调用 npm，Windows runner 上 cmd.exe 里
      # 「'npm' is not recognized」直接失败；且根依赖（electron/vite/esbuild）这条自检用不到：
      # 能力单测、探针、beforePack 检查都只 require 仓库内 .cjs，不读根 node_modules。
      - name: 依赖安装（voice-bridge）
        working-directory: voice-bridge
        run: npm ci --no-audit --no-fund

      # 两个用途：
      #   1) 让「真机能探到截图后端 / 粘贴工具」在 Linux 上成为阳性断言（scrot + xdotool）
      #   2) bit-core 在 Linux 链接 -lxcb / -lxdo（截图与模拟按键依赖），缺 dev 包则链接期就红
      - name: 系统截图/粘贴工具与链接依赖（Linux）
        if: matrix.name == 'linux-x64'
        run: |
          sudo apt-get update
          sudo apt-get install -y scrot xdotool libxcb1-dev libxdo-dev

      - name: 能力探测单测
        run: node --test e2e/capabilities-test.cjs

      - name: 本机真实探测结果（三端对照）
        run: node e2e/capabilities-probe.cjs

      # ↓ 端到端与单测必须排在 beforePack 检查之前：beforePack 会改写并（CI 环境下）
      # 剪掉 voice-bridge/node_modules 里的识别原生包，跑完再动它们就来不及了。
      # push 事件下 inputs.* 恒为空，直接写 if: inputs.x 会让端到端在自动触发里静默跳过，
      # 所以只在手动触发时才看开关。
      - name: 内核端到端（真下载 + 解档 + 执行）
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.with_kernel }}
        run: cargo test -p bit-core --lib tts::tests::e2e_cli_install_real_and_runs -- --ignored --nocapture

      - name: 识别端到端（模型下载 + worker + 固定素材转写）
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.with_asr }}
        run: cargo test -p bit-core --lib voice::tests::e2e_download_and_transcribe -- --ignored --nocapture

      - name: 相关单测（tts）
        run: "cargo test -p bit-core --lib tts::"

      - name: 相关单测（voice，含下载续传与就绪判定）
        run: "cargo test -p bit-core --lib voice::"

      # 全量单测仅作参考：既有的 Windows 路径/工具门控用例在非 Windows 上本就红
      - name: 全量单测（信息性，不作为闸门）
        continue-on-error: true
        run: cargo test -p bit-core --lib

      # 跨架构补装检查放最后：它会往 voice-bridge/node_modules 装 foreign 包并删掉
      # runner 自身的包（pruneForeign 只在 CI=true 时生效），属于「用完即弃」的步骤。
      - name: beforePack 跨架构补装（存在的目标包）
        env:
          BIT_XCHECK_PLATFORM: ${{ matrix.xcheck_platform }}
          BIT_XCHECK_ARCH: ${{ matrix.xcheck_arch }}
          BIT_XCHECK_EXPECT: install
        run: node e2e/before-pack-check.cjs

      - name: beforePack 对未发布架构明确跳过
        env:
          BIT_XCHECK_PLATFORM: ${{ matrix.skip_platform }}
          BIT_XCHECK_ARCH: ${{ matrix.skip_arch }}
          BIT_XCHECK_EXPECT: skip
        run: node e2e/before-pack-check.cjs
