[package]
name = "bit-core"
description = "BIT core: agent engine, tools, storage, worker, TUI (framework-agnostic)"
version.workspace = true
edition = "2021"

[lib]
name = "bit_core"
path = "src/lib.rs"

[[bin]]
name = "bit-cli"
path = "src/bin/bit-cli.rs"

[dependencies]
# 守护进程：接力拉起前校验主程序二进制 sha256（防病毒换装借壳复活）
sha2 = "0.10"
# HiddenCode 敏感信息脱敏：手机号/邮箱/API key 内置正则探测与掩码
regex = "1"
# 控制台输出解码：中文 Windows cmd/PowerShell 管道输出默认 GBK(936)，UTF-8 直通 + GBK 兜底
encoding_rs = "0.8"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
axum = "0.8"
reqwest = { version = "0.12", features = ["json", "blocking", "stream"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
rhai = { version = "1", features = ["serde"] }
futures-util = "0.3"
# 附件解析：Excel(calamine) / Word(.docx via zip+xml) / 网页正文(scraper) / base64 解析
# calamine/quick-xml 保持跟随上游修复版：quick-xml <0.41 有 DoS 公告（RUSTSEC-2026-0194/0195）
calamine = "0.36"
scraper = "0.20"
base64 = "0.22"
zip = "2"
quick-xml = "0.42"
# 页眉仪表盘：本进程内存占用查询
sysinfo = "0.33"
# 幻觉防护：中文分词（jieba 搜索粒度）检测回复中某个词异常重复
jieba-rs = "0.7"
# 全量数据存储：sessions/config/audit/memory 等统一入库（bundled 自带 SQLite 免系统依赖）
rusqlite = { version = "0.32", features = ["bundled"] }
# 远程二维码：网卡地址枚举（LAN IPv4 / 全球 IPv6）+ 离线二维码 SVG 生成
if-addrs = "0.13"
qrcode = { version = "0.14", features = ["svg"] }
# 调试追踪：无锁 channel + 后台 flush，死锁诊断专用
crossbeam-channel = "0.5"
# 本机操控三件套（实验性，设置页开关）：截屏 + 鼠标/键盘合成输入
# enigo 在 Linux 依赖 libxdo（Alpine musl 无包、exotic 架构容器缺失）导致链接失败，
# 因此做成可选 feature：musl/exotic/无 GUI 目标用 --no-default-features 编译即可跳过
screenshots = { version = "0.8", optional = true }
enigo = { version = "0.2", optional = true }
image = { version = "0.25", default-features = false, features = ["png"], optional = true }
# 全屏 TUI（真终端时启用；管道/无 TTY 自动回退行协议，E2E 不受影响）。
# exotic/musl 目标用 --no-default-features 跳过
ratatui = { version = "0.30", optional = true }
crossterm = { version = "0.29", optional = true }

[features]
default = ["desktop-ctl", "tui-ui"]
desktop-ctl = ["dep:screenshots", "dep:enigo", "dep:image"]
tui-ui = ["dep:ratatui", "dep:crossterm"]

# Windows 原生加密第二层：DPAPI（CryptProtectData，CurrentUser 绑定本机本用户）
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Security_Cryptography", "Win32_Foundation"] }
