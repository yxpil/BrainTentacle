# yxpil · electron-builder 打包配置（M4 发布链）
#
# 产物命名对齐 latest.json assets 键位（sync-channels / mirror-pages 零改动）：
#   windows-x64   BIT_<v>_x64-setup.exe        windows-arm64 BIT_<v>_aarch64-setup.exe
#   macos-arm64   BIT_<v>_aarch64.dmg/-app.zip macos-x64     BIT_<v>_x64.dmg/-app.zip
#   linux-x64     BIT_<v>_amd64.AppImage       linux-arm64   BIT_<v>_aarch64.AppImage
# arch 命名（x64/aarch64/amd64）不依赖 ${arch} 宏（各平台宏值不一致），
# 由 CI/本地脚本按矩阵入口以 -c.artifactName=... 显式覆盖。
#
# resources 根注入（extraResources）：bit.node（napi 核心）+ bit-cli（worker/guardian sidecar）
# + icon.ico（托盘/通知用），由 scripts/stage-pack.cjs（本地）或 napi 矩阵 artifact（CI）
# 复制到 packaging/native/。
appId: com.bit.hub
productName: BIT
directories:
  output: release
files:
  - dist/**
  - electron/**
  - dsh-bridge/**
  - voice-bridge/**
  - package.json
  - "!**/*.map"
  - "!node_modules/**"
  # 依赖自带的测试与示例：files 一旦被自定义，electron-builder 默认的 node_modules
  # 清理规则就不再套用，dsh-bridge/node_modules 里 zod / MCP SDK / fast-uri 等自带的
  # test/、examples/、*.test.js 会原样进包（实测 464 个文件、2.6 MB，运行期没人 require）。
  # 只按「测试形状」清，LICENSE/README 保留 —— MIT 许可要求随包带上许可证文本。
  - "!**/node_modules/**/{test,tests,__tests__,example,examples,spec,fixture,fixtures}/**"
  - "!**/node_modules/**/*.{test,spec}.{js,mjs,cjs,ts}"
extraResources:
  - from: packaging/native
    to: .
asar: true
# dsh-bridge / voice-bridge 保持磁盘真实文件（不进 asar）：作为 stdio MCP server 与
# 语音识别子进程时由 Electron 二进制以 ELECTRON_RUN_AS_NODE=1 直接执行脚本路径，
# 对应 Rust find_bridge_script / find_worker_script 的
# resources/app.asar.unpacked/{dsh-bridge/dsh-mcp.mjs, voice-bridge/voice-worker.mjs}。
# 本地合成内核（sherpa-onnx-offline-tts CLI）不再随包分发：跨平台单架构二进制打包时
# 无法通用，改由 Rust tts::ensure_cli 按 assets.json 的 tts_bin 分区在首启下载时装到
# 数据目录 tts/cli/<os-arch>/，与各引擎模型同一条下载链路。
asarUnpack:
  - dsh-bridge/**
  - voice-bridge/**
compression: maximum
# 打包前：按目标平台/架构补齐 voice-bridge 的 sherpa-onnx-<os>-<arch> 原生包。
# npm 只会装「构建机」那一份，跨架构出包（macos-14 runner 出 x64 包等）会漏掉目标架构，
# 用户端识别以「Could not find sherpa-onnx-node」失败——钩子负责补装并校验落位。
beforePack: scripts/before-pack.cjs
# 打包收尾：删除 Electron 自带 default_app（防止 BIT.exe 回退成裸 Chromium 浏览器）
afterPack: scripts/after-pack.cjs

win:
  icon: src-tauri/icons/icon.ico
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: true
  perMachine: false
  deleteAppDataOnUninstall: false
  # customInit 里拦下"ARM64 包下到 x64 电脑"：见 packaging/nsis/installer.nsh
  include: packaging/nsis/installer.nsh

mac:
  # CI 用 --dir 出 .app 后手工 ad-hoc 深签名 + hdiutil/ditto（对齐旧 Tauri 流程，防 Gatekeeper"已损坏"）
  identity: null
  icon: src-tauri/icons/icon.icns
  category: public.app-category.productivity
  target:
    - target: dir
  # universal 合并（--universal）逐文件比对两份构建：单架构 Mach-O 若在 x64 与 arm64
  # 包里内容完全相同，@electron/universal 会直接报错（它没法 lipo 两份一样的东西）。
  # 按平台分包的原生模块正是这种形状——sherpa-onnx-darwin-<arch>/sherpa-onnx.node、
  # @koromix/koffi-darwin-<arch>/darwin_<arch>/koffi.node 都被两份构建原样带上，
  # 运行期由包名/目录名挑自己那一份。这里声明为「按架构各自保留」，跳过 lipo。
  # 注意：两架构的文件清单必须完全一致（多一个少一个都会判失败），所以不能靠打包前删包。
  x64ArchFiles: '**/*darwin*/*.node'

linux:
  icon: src-tauri/icons/256x256.png
  category: Development
  maintainer: yxpil <yxpil@users.noreply.github.com>
  target:
    - target: AppImage
    - target: deb
    - target: rpm
