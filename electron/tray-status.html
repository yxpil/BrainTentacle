<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>任务面板 · 触手怪</title>
<style>
  :root {
    --win-radius: 16px;
    /* --bg 由 render() 按快照注入主界面真实背景色（--look-bg-*），默认值与主界面 styles.css 一致 */
    --bg: #ffffff;
    --card: #ffffff;
    --border: #e5e5e5;
    --text: #171717;
    --text2: #737373;
    --text3: #a3a3a3;
    --ok: #16a34a;
    --run: #0284c7;
    --warn: #ea580c;
  }
  body.dark {
    --bg: #18181b;
    --card: #171717;
    --border: #262626;
    --text: #fafafa;
    --text2: #a3a3a3;
    --text3: #525252;
    --ok: #4ade80;
    --run: #38bdf8;
    --warn: #fb923c;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: transparent; }
  body { font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif; font-size: 13px; color: var(--text); }
  /* 窗口圆角容器（与主窗口同方案：透明窗体 + CSS 圆角 + 垫实色底） */
  #root {
    height: 100%;
    border-radius: var(--win-radius);
    background: var(--bg);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    border: 1px solid var(--border);
  }
  #root::before { content: ""; position: absolute; inset: 0; z-index: -1; background: var(--bg); border-radius: var(--win-radius); }

  /* ── 标题栏（拖拽区 + 关闭按钮，风格与主窗口一致） ── */
  .titlebar {
    display: flex; align-items: center;
    height: 36px; padding: 4px 16px 4px 14px;
    -webkit-app-region: drag;
    user-select: none;
    flex-shrink: 0;
  }
  .titlebar .t { font-size: 12px; font-weight: 600; letter-spacing: 0.2px; color: var(--text2); }
  .titlebar .sp { flex: 1; }
  .wbtn {
    -webkit-app-region: no-drag;
    display: flex; align-items: center; justify-content: center;
    width: 24px; height: 24px; border-radius: 999px;
    color: var(--text2); background: transparent; border: none; cursor: pointer;
    transition: background-color 0.15s, color 0.15s;
  }
  .wbtn:hover { background: var(--btn-hover, rgba(0,0,0,0.06)); color: var(--text); }
  body.dark .wbtn:hover { background: rgba(255,255,255,0.1); }
  .wbtn.close:hover { background: #dc2626; color: #fff; }

  .scroll { flex: 1; overflow-y: auto; padding: 2px 14px 12px; }
  .head { display: flex; align-items: baseline; gap: 8px; padding: 2px 4px 10px; }
  .head h1 { font-size: 14px; font-weight: 600; letter-spacing: 0.2px; }
  .head .ts { margin-left: auto; font-size: 11px; color: var(--text3); font-variant-numeric: tabular-nums; }

  .overall {
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    padding: 12px 14px; margin-bottom: 14px;
    display: flex; align-items: center; gap: 10px;
  }
  .overall .state { font-weight: 600; }
  .overall .detail { margin-left: auto; color: var(--text2); font-size: 12px; }

  .section { margin-bottom: 14px; }
  .section-title {
    display: flex; align-items: center; gap: 6px;
    font-size: 11px; font-weight: 600; color: var(--text2);
    letter-spacing: 0.6px; padding: 0 4px 6px;
  }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--text3); flex-shrink: 0; }
  .dot.run { background: var(--run); }
  .dot.ok { background: var(--ok); }
  .count { margin-left: auto; color: var(--text3); font-weight: 400; }
  .items { display: flex; flex-direction: column; gap: 6px; }
  .item {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 9px 12px; display: flex; align-items: center; gap: 10px;
    animation: rise 0.18s ease-out;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: none; } }
  .item .label { flex: 1; min-width: 0; overflow-wrap: anywhere; word-break: break-word; }
  .item .label.mono { font-family: Consolas, "Cascadia Mono", monospace; font-size: 12px; }
  .item .secs { color: var(--text2); font-size: 11px; font-variant-numeric: tabular-nums; flex-shrink: 0; }
  .item .badge { flex-shrink: 0; font-size: 10px; padding: 2px 7px; border-radius: 999px; border: 1px solid var(--border); color: var(--text2); }
  .badge.b-run { color: var(--run); border-color: color-mix(in srgb, var(--run) 35%, transparent); }
  .badge.b-pending { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 35%, transparent); }
  /* 计划条目删除按钮：默认低调，hover 条目时浮现，hover 按钮变红（危险操作） */
  .gdel {
    flex-shrink: 0; display: flex; align-items: center; justify-content: center;
    width: 20px; height: 20px; border-radius: 999px;
    color: var(--text3); background: transparent; border: none; cursor: pointer;
    opacity: 0; transition: opacity 0.12s, background-color 0.15s, color 0.15s;
  }
  .item:hover .gdel { opacity: 1; }
  .gdel:hover { background: rgba(220,38,38,0.1); color: #dc2626; }
  .empty { border: 1px dashed var(--border); border-radius: 12px; padding: 12px; text-align: center; color: var(--text3); font-size: 12px; }

  .foot {
    flex-shrink: 0; padding: 8px 14px 10px;
    border-top: 1px solid var(--border);
    display: flex; align-items: center;
  }
  .quit {
    font-size: 11px; color: var(--text3); background: none; border: none; cursor: pointer;
    padding: 3px 8px; border-radius: 8px; transition: color 0.15s, background-color 0.15s;
  }
  .quit:hover { color: var(--text); background: rgba(0,0,0,0.06); }
  body.dark .quit:hover { background: rgba(255,255,255,0.1); }
  .quit.danger:hover { color: #dc2626; background: rgba(220,38,38,0.08); }
  .foot .gap { width: 10px; }
  .foot .hint { margin-left: auto; font-size: 10px; color: var(--text3); }
</style>
</head>
<body>
<div id="root">
  <div class="titlebar">
    <span class="t" data-i18n="title">任务面板</span>
    <span class="sp"></span>
    <button class="wbtn close" id="btn-close" title="关闭" data-i18n-title="close">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
  </div>
  <div class="scroll">
    <div class="head">
      <h1 data-i18n="status">任务状态</h1>
      <span class="ts" id="ts"></span>
    </div>
    <div class="overall" id="overall"></div>
    <div class="section">
      <div class="section-title"><span class="dot" id="d-chats"></span><span data-i18n="chats">运行中会话</span><span class="count" id="c-chats"></span></div>
      <div class="items" id="chats"></div>
    </div>
    <div class="section">
      <div class="section-title"><span class="dot" id="d-jobs"></span><span data-i18n="jobs">后台命令</span><span class="count" id="c-jobs"></span></div>
      <div class="items" id="jobs"></div>
    </div>
    <div class="section">
      <div class="section-title"><span class="dot" id="d-subs"></span><span data-i18n="subs">子代理</span><span class="count" id="c-subs"></span></div>
      <div class="items" id="subs"></div>
    </div>
    <div class="section">
      <div class="section-title"><span class="dot" id="d-goals"></span><span data-i18n="goals">活跃计划</span><span class="count" id="c-goals"></span></div>
      <div class="items" id="goals"></div>
    </div>
  </div>
  <div class="foot">
    <button class="quit" id="btn-show" data-i18n="show">显示主界面</button>
    <span class="gap"></span>
    <button class="quit danger" id="btn-quit" data-i18n="quit">退出应用</button>
    <span class="hint" data-i18n="hint">左键托盘图标 = 主界面 · 失焦自动收起</span>
  </div>
</div>
<script>
  const { ipcRenderer } = require('electron');
  let snap = { chats: [], jobs: [], subs: [], goals: [], theme: null, lang: 'zh' };

  // ── 双语：语言标记随快照（bit.db 统一源，主进程透传）——面板自身不落库 ──
  const STR = {
    title: { zh: '任务面板', en: 'Task Panel' },
    status: { zh: '任务状态', en: 'Task Status' },
    chats: { zh: '运行中会话', en: 'Running chats' },
    jobs: { zh: '后台命令', en: 'Background commands' },
    subs: { zh: '子代理', en: 'Sub-agents' },
    goals: { zh: '活跃计划', en: 'Active plans' },
    show: { zh: '显示主界面', en: 'Show main window' },
    quit: { zh: '退出应用', en: 'Quit app' },
    hint: { zh: '左键托盘图标 = 主界面 · 失焦自动收起', en: 'Click tray icon = main window · auto-hide on blur' },
    close: { zh: '关闭', en: 'Close' },
    running: { zh: '运行中', en: 'Running' },
    bg: { zh: '后台', en: 'BG' },
    delegated: { zh: '委派', en: 'Delegated' },
    delGoal: { zh: '删除此计划', en: 'Delete this plan' },
    todo: { zh: '待办', en: 'Todos' },
    inProg: { zh: '进行中', en: 'In progress' },
    emptyChats: { zh: '没有运行中的会话回合', en: 'No running chat turns' },
    emptyJobs: { zh: '没有后台命令', en: 'No background commands' },
    emptySubs: { zh: '没有派生的子代理', en: 'No sub-agents' },
    emptyGoals: { zh: '没有活跃计划', en: 'No active plans' },
    nRunning: { zh: ' 项任务进行中', en: ' task(s) running' },
    chatN: { zh: ' 会话', en: ' chats' },
    bgN: { zh: ' 后台命令', en: ' bg commands' },
    subN: { zh: ' 子代理', en: ' sub-agents' },
    idle: { zh: '空闲', en: 'Idle' },
    noTask: { zh: '当前没有进行中的任务', en: 'Nothing running right now' },
    nItems: { zh: ' 项', en: '' },
  };
  const L = (k) => STR[k]?.[(snap.lang === 'en') ? 'en' : 'zh'] ?? k;
  // 语言切换时刷新静态 DOM（data-i18n / data-i18n-title）并清签名强制重建列表
  let lastLang = '';
  function applyLang() {
    if (lastLang === snap.lang) return;
    lastLang = snap.lang;
    document.documentElement.lang = snap.lang === 'en' ? 'en' : 'zh-CN';
    document.querySelectorAll('[data-i18n]').forEach((el) => { el.textContent = L(el.getAttribute('data-i18n')); });
    document.querySelectorAll('[data-i18n-title]').forEach((el) => { el.title = L(el.getAttribute('data-i18n-title')); });
    Object.keys(lastSigs).forEach((k) => delete lastSigs[k]); // 强制列表按新语言重建
  }

  const $ = (id) => document.getElementById(id);
  const fmtSecs = (since) => {
    const s = Math.max(0, Math.floor((Date.now() - since) / 1000));
    if (s < 60) return s + 's';
    return Math.floor(s / 60) + 'm' + String(s % 60).padStart(2, '0') + 's';
  };
  const esc = (t) => String(t ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  // 防闪烁：每秒定时器只做「签名比对 + 耗时定向刷新」，DOM 仅在数据真正变化时重建，
  // 避免全量 innerHTML 重建让所有条目每秒重播入场动画
  const lastSigs = {};
  const refreshSecs = (listId) => {
    document.getElementById(listId).querySelectorAll('[data-since]').forEach((el) => {
      el.textContent = fmtSecs(Number(el.getAttribute('data-since')));
    });
  };

  function renderSection(listId, countId, dotId, items, emptyText, rowFn) {
    const list = $(listId), count = $(countId), dot = $(dotId);
    if (count) count.textContent = items.length ? items.length + L('nItems') : '';
    if (dot) dot.className = 'dot' + (items.length ? ' run' : '');
    const sig = JSON.stringify(items);
    if (lastSigs[listId] === sig) { refreshSecs(listId); return; }
    lastSigs[listId] = sig;
    if (!items.length) { list.innerHTML = '<div class="empty">' + esc(emptyText) + '</div>'; return; }
    list.innerHTML = items.map(rowFn).join('');
  }

  function render() {
    applyLang();
    if (snap.theme) document.body.classList.toggle('dark', snap.theme === 'dark');
    // 背景色用主界面真实渲染色（外观定制跟随）——杜绝"面板一个色、主界面另一个色"
    if (snap.look) {
      const bg = snap.theme === 'dark' ? (snap.look.dark || '#18181b') : (snap.look.light || '#ffffff');
      document.body.style.setProperty('--bg', bg);
      document.getElementById('root').style.setProperty('--bg', bg);
    }
    const total = snap.chats.length + snap.jobs.length + snap.subs.length;
    const ovSig = total + '|' + snap.chats.length + '|' + snap.jobs.length + '|' + snap.subs.length + '|' + snap.theme + '|' + snap.lang;
    if (lastSigs._ov !== ovSig) {
      lastSigs._ov = ovSig;
      $('overall').innerHTML = total
        ? '<span class="dot run"></span><span class="state">' + total + L('nRunning') + '</span><span class="detail">' +
          [snap.chats.length ? snap.chats.length + L('chatN') : '', snap.jobs.length ? snap.jobs.length + L('bgN') : '', snap.subs.length ? snap.subs.length + L('subN') : ''].filter(Boolean).join(' · ') + '</span>'
        : '<span class="dot ok"></span><span class="state">' + L('idle') + '</span><span class="detail">' + L('noTask') + '</span>';
    }
    $('ts').textContent = new Date(snap.ts || Date.now()).toLocaleTimeString(snap.lang === 'en' ? 'en-US' : 'zh-CN', { hour12: false });

    renderSection('chats', 'c-chats', 'd-chats', snap.chats, L('emptyChats'), (it) =>
      '<div class="item"><span class="badge b-run">' + L('running') + '</span><span class="label">' + esc(it.label) + '</span><span class="secs" data-since="' + Number(it.since) + '">' + fmtSecs(it.since) + '</span></div>');
    renderSection('jobs', 'c-jobs', 'd-jobs', snap.jobs, L('emptyJobs'), (it) =>
      '<div class="item" title="' + esc(it.label) + '"><span class="badge b-run">' + L('bg') + '</span><span class="label mono">' + esc(it.label) + '</span><span class="secs" data-since="' + Number(it.since) + '">' + fmtSecs(it.since) + '</span></div>');
    renderSection('subs', 'c-subs', 'd-subs', snap.subs, L('emptySubs'), (it) =>
      '<div class="item"><span class="badge b-run">' + L('delegated') + '</span><span class="label">' + esc(it.label) + '</span><span class="secs" data-since="' + Number(it.since) + '">' + fmtSecs(it.since) + '</span></div>');
    renderSection('goals', 'c-goals', 'd-goals', snap.goals, L('emptyGoals'), (g) =>
      '<div class="item" title="' + esc(g.text) + '"><span class="badge ' + (g.pending ? 'b-pending' : 'b-run') + '">' + (g.pending ? L('todo') + ' ' + g.pending : L('inProg')) + '</span><span class="label">' + esc(g.text) + '</span><button class="gdel" data-gid="' + esc(g.id) + '" title="' + L('delGoal') + '"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>');
  }

  $('btn-close').onclick = () => ipcRenderer.send('tray:hide');
  $('btn-show').onclick = () => ipcRenderer.send('tray:show');
  $('btn-quit').onclick = () => ipcRenderer.send('tray:quit');
  // 删除计划：事件委托（goals 区 innerHTML 按签名重建，直接绑会丢）
  $('goals').addEventListener('click', (e) => {
    const btn = e.target?.closest?.('.gdel');
    if (btn?.dataset?.gid) ipcRenderer.send('tray:remove-goal', btn.dataset.gid);
  });
  ipcRenderer.on('tray:status', (_e, s) => { snap = s || snap; render(); });
  setInterval(render, 1000); // 秒级刷新耗时
  render();
</script>
</body>
</html>
