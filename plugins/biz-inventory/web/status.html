<!doctype html>
<!-- 状态面板：出现在「插件」页右侧详情里，只报本插件自己的运行痕迹，每 5 秒刷新一次。 -->
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>盘点状态</title>
    <style>
      :root { --fg:#171717; --muted:#6b7280; --line:#e5e5e5; --ok:#0d9488; }
      @media (prefers-color-scheme: dark){ :root{ --fg:#f5f5f5; --muted:#a3a3a3; --line:#333; --ok:#2dd4bf; } }
      body { margin:0; padding:12px; color:var(--fg); font:12px/1.6 "Segoe UI","Microsoft YaHei",sans-serif; }
      h3 { margin:0 0 8px; font-size:12px; }
      .kv { display:flex; justify-content:space-between; border-bottom:1px solid var(--line); padding:4px 0; }
      .k { color:var(--muted); }
      .v { font-variant-numeric:tabular-nums; }
      .dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--ok); margin-right:6px; }
      ul { margin:6px 0 0; padding-left:16px; color:var(--muted); }
    </style>
  </head>
  <body>
    <h3><span class="dot"></span>盘点状态</h3>
    <div class="kv"><span class="k">握手</span><span class="v" id="hand">…</span></div>
    <div class="kv"><span class="k">数据文件</span><span class="v" id="n">0</span></div>
    <div class="kv"><span class="k">最近盘点</span><span class="v" id="last">—</span></div>
    <div class="kv"><span class="k">生效权限</span><span class="v" id="perms">—</span></div>
    <ul id="files"></ul>
    <script>
      const $ = (id) => document.getElementById(id);
      async function tick() {
        try {
          const info = await Bit.ready();
          $("hand").textContent = info ? "已连通" : "等待帧握手";
          if (info) $("perms").textContent = info.permissions.join(" / ");
          const r = await Bit.data.list();
          $("n").textContent = (r.files || []).length;
          $("files").innerHTML = (r.files || []).map((f) => `<li>${f.path} · ${f.bytes}B</li>`).join("");
          const text = await Bit.data.read("counted.json").catch(() => "");
          $("last").textContent = text ? `有（${JSON.parse(text).length} 条）` : "还没有";
        } catch (e) {
          $("hand").textContent = "失败：" + (e.message || e);
        }
      }
      tick();
      setInterval(tick, 5000);
    </script>
  </body>
</html>
