<!doctype html>
<!-- 语音转写台：接管内置话筒之后，用户点对话页那颗图标就该到这里来。
     这里不接真的录音，只演示「转写结果 → 送进对话」的闭环：写进本插件会话 + 跳回对话页。 -->
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>语音转写</title>
    <style>
      :root { --bg:#fafafa; --fg:#171717; --muted:#6b7280; --line:#e5e5e5; --card:#fff; --accent:#c026d3; }
      @media (prefers-color-scheme: dark){ :root{ --bg:#171717; --fg:#f5f5f5; --muted:#a3a3a3; --line:#333; --card:#1f1f1f; --accent:#e879f9; } }
      * { box-sizing:border-box; }
      body { margin:0; padding:16px; background:var(--bg); color:var(--fg); font:13px/1.6 "Segoe UI","Microsoft YaHei",sans-serif; }
      h1 { margin:0 0 4px; font-size:16px; }
      .sub { color:var(--muted); margin-bottom:12px; }
      textarea { width:100%; min-height:120px; padding:8px; border:1px solid var(--line); border-radius:8px; background:transparent; color:var(--fg); font:inherit; }
      button { margin-top:8px; margin-right:6px; padding:6px 12px; border:1px solid var(--accent); border-radius:6px; background:var(--accent); color:#fff; cursor:pointer; font:inherit; }
      button.ghost { background:transparent; color:var(--accent); }
      .tip { color:var(--muted); font-size:12px; margin-top:8px; }
    </style>
  </head>
  <body>
    <h1>语音转写台</h1>
    <div class="sub" id="who">正在握手…</div>
    <textarea id="text" placeholder="把转写结果贴进来（或就地敲两段）"></textarea>
    <div>
      <button id="send">送进对话</button>
      <button id="keep" class="ghost">只存档</button>
      <button id="back" class="ghost">回对话页</button>
    </div>
    <div class="tip" id="tip"></div>
    <script>
      const $ = (id) => document.getElementById(id);

      async function boot() {
        const info = await Bit.ready();
        $("who").textContent = info ? `${info.plugin_name} · 已接管内置语音入口` : "握手尚未完成";
        $("text").value = (await Bit.storage.get("last")) || "";
      }

      $("send").addEventListener("click", async () => {
        const t = $("text").value.trim();
        if (!t) return ($("tip").textContent = "先有内容");
        await Bit.sessions.append("user", `转写：${t}`);
        await Bit.storage.set("last", t);
        $("tip").textContent = "已写进本插件会话，并跳回对话页";
        await Bit.openPage("chat");
      });
      $("keep").addEventListener("click", async () => {
        await Bit.storage.set("last", $("text").value);
        $("tip").textContent = "已暂存（命名空间存储）";
      });
      $("back").addEventListener("click", () => Bit.openPage("chat"));

      boot().catch((e) => ($("who").textContent = "握手失败：" + (e.message || e)));
    </script>
  </body>
</html>
