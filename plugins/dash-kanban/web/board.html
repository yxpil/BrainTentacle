<!doctype html>
<!-- 看板页：卡片放在宿主代管的命名空间存储里（storage 权限），换机器不丢、删插件即清。 -->
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>看板</title>
    <style>
      :root { --bg:#fafafa; --fg:#171717; --muted:#6b7280; --line:#e5e5e5; --card:#fff; --accent:#0891b2; }
      @media (prefers-color-scheme: dark){ :root{ --bg:#171717; --fg:#f5f5f5; --muted:#a3a3a3; --line:#333; --card:#1f1f1f; --accent:#22d3ee; } }
      * { box-sizing:border-box; }
      body { margin:0; padding:16px; background:var(--bg); color:var(--fg); font:13px/1.6 "Segoe UI","Microsoft YaHei",sans-serif; }
      h1 { margin:0 0 10px; font-size:16px; }
      .cols { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; }
      .col { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px; min-height:180px; }
      .col h2 { margin:0 0 8px; font-size:12px; color:var(--muted); }
      .item { border:1px solid var(--line); border-radius:8px; padding:6px 8px; margin-bottom:6px; display:flex; justify-content:space-between; gap:6px; }
      .item button { border:0; background:none; color:var(--muted); cursor:pointer; font:inherit; }
      .bar { display:flex; gap:8px; margin-bottom:12px; }
      input, select, button.go { font:inherit; padding:6px 8px; border:1px solid var(--line); border-radius:6px; background:transparent; color:var(--fg); }
      button.go { border-color:var(--accent); background:var(--accent); color:#fff; cursor:pointer; }
      .note { color:var(--muted); font-size:12px; }
    </style>
  </head>
  <body>
    <h1>项目看板</h1>
    <div class="bar">
      <input id="title" placeholder="要做的事" />
      <select id="col"><option>待办</option><option>进行中</option><option>完成</option></select>
      <button class="go" id="add">加一张</button>
      <span class="note" id="hint"></span>
    </div>
    <div class="cols" id="cols"></div>
    <script>
      const $ = (id) => document.getElementById(id);
      const KEY = "cards";
      const COLS = ["待办", "进行中", "完成"];
      let cards = [];

      async function load() {
        const raw = await Bit.storage.get(KEY);
        cards = raw ? JSON.parse(raw) : [];
        const wip = await Bit.settings.get("wip_limit");
        $("hint").textContent = `在制品上限：${wip || "（未设置）"} · 共 ${cards.length} 张卡`;
        render();
      }

      function save() {
        return Bit.storage.set(KEY, JSON.stringify(cards)).then(render);
      }

      function render() {
        $("cols").innerHTML = "";
        for (const name of COLS) {
          const col = document.createElement("div");
          col.className = "col";
          const items = cards.filter((c) => c.col === name);
          col.innerHTML = `<h2>${name} · ${items.length}</h2>`;
          for (const c of items) {
            const row = document.createElement("div");
            row.className = "item";
            row.innerHTML = `<span>${c.title}</span>`;
            const next = COLS[(COLS.indexOf(c.col) + 1) % COLS.length];
            const b1 = document.createElement("button");
            b1.textContent = "→";
            b1.title = `推到${next}`;
            b1.onclick = () => { c.col = next; save(); };
            const b2 = document.createElement("button");
            b2.textContent = "×";
            b2.onclick = () => { cards = cards.filter((x) => x.id !== c.id); save(); };
            row.append(b1, b2);
            col.appendChild(row);
          }
          $("cols").appendChild(col);
        }
      }

      $("add").addEventListener("click", () => {
        const title = $("title").value.trim();
        if (!title) return;
        cards.push({ id: Date.now(), title, col: $("col").value });
        $("title").value = "";
        save();
      });

      load().catch((e) => ($("hint").textContent = "读取失败：" + (e.message || e)));
    </script>
  </body>
</html>
